<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TI Desk | Gestão de TI</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e8eff9;background:#0b1220;--bg:#0b1220;--surface:#131f30;--surface2:#19283b;--border:#2a3b50;--text:#e8eff9;--muted:#9aabc0;--accent:#14b8a6;--accent2:#0e8f83}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}header{height:88px;background:#101b2d;border-bottom:1px solid var(--border);color:var(--text);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-left:238px}header h2{font-size:24px;letter-spacing:-.5px;margin:0 0 5px}header h2 small{color:var(--accent);font-size:15px}header small{color:var(--muted);font-size:12px}.wrap{max-width:none;margin-left:238px;padding:28px 32px 70px}nav{position:fixed;left:0;top:0;bottom:0;width:238px;background:#101b2d;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px;padding:110px 12px 24px;overflow-y:auto;z-index:10}nav:before{content:'MENU PRINCIPAL';position:absolute;top:78px;left:24px;font-size:10px;letter-spacing:2px;font-weight:700;color:#6e849e}nav button{display:block;text-align:left;width:100%;background:transparent;color:#aabbd0;border:1px solid transparent;border-radius:10px;padding:14px 15px;font-size:14px;transition:.15s}nav button:hover{background:#1b2d42;color:#fff;filter:none}nav button.active{background:#123b42;border-color:#1d6e70;color:#4de1cd;font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}button{background:var(--accent2);color:#fff;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit;font-weight:600;transition:.15s}button:hover{filter:brightness(1.13)}button.secondary{background:#26364b;color:#dce9f8}button.danger{background:#a83f55}h1{font-size:27px;letter-spacing:-.6px;margin:0 0 23px}h3{margin:0 0 17px;font-size:17px;letter-spacing:-.2px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin-bottom:23px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:21px;box-shadow:0 8px 24px #00000015}.card{min-height:118px;position:relative;overflow:hidden}.card:before{content:'';position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:4px;background:var(--accent)}.card b{display:block;font-size:29px;letter-spacing:-.7px;margin-top:12px;color:#fff}.card .muted{font-size:13px}.panel{margin:17px 0 22px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}label{display:block;font-size:13px;font-weight:600;margin:0 0 7px;color:#c9d8e9}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #34465c;border-radius:9px;font:inherit;background:#0f1a2b;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #14b8a61e}input::placeholder,textarea::placeholder{color:#8193a9}select option{background:#152338;color:#fff}textarea{min-height:90px}input[type=checkbox]{width:auto}.wide{grid-column:1/-1}.scroll{overflow:auto;border-radius:9px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #29394b;white-space:nowrap}th{background:#1b2b40;color:#b9cce0;font-size:12px;font-weight:700}tbody tr:hover{background:#1a2b3d}td button{padding:7px 10px;font-size:12px}.tag{display:inline-block;border-radius:30px;background:#243f5d;color:#c9e3ff;padding:5px 10px;font-size:12px}.late{background:#542733;color:#ffb1bf}.good{background:#164a40;color:#8ff1ce}.bar{background:#283b50;border-radius:8px;overflow:hidden;height:13px;min-width:100px}.bar i{display:block;background:linear-gradient(90deg,var(--accent2),var(--accent));height:100%;border-radius:8px}.help{font-size:13px;color:var(--muted);margin:12px 0;line-height:1.65}.empty{padding:30px;color:#93a7bd;text-align:center}.foot{padding:22px;text-align:center;font-size:12px;color:#70839b;margin-left:238px}a{color:#51dac9}#app{min-height:60vh}#editor .panel{border-color:#266b68}
@media(max-width:1000px){header{margin-left:205px}.wrap,.foot{margin-left:205px}nav{width:205px}.wrap{padding:22px}}
@media(max-width:700px){header{margin-left:0;height:auto;min-height:75px;padding:16px 18px;align-items:flex-start}header h2{font-size:20px}header>small{max-width:125px;text-align:right}.wrap{margin-left:0;padding:18px 13px 85px}nav{position:sticky;top:0;left:auto;bottom:auto;width:100%;height:auto;display:flex;flex-direction:row;overflow-x:auto;padding:10px;background:#101b2d;border-right:0;border-bottom:1px solid var(--border);gap:7px;scrollbar-width:thin}nav:before{display:none}nav button{white-space:nowrap;width:auto;flex:none;padding:11px 12px;font-size:12px}nav button.active{box-shadow:inset 0 -3px 0 var(--accent)}h1{font-size:23px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:102px;padding:14px}.card b{font-size:23px}.panel{padding:15px}.foot{margin-left:0}table{font-size:12px}.actions input,.actions select{max-width:100%!important}}
@media print{body{background:#fff;color:#17233a}header,nav,.actions,button,.foot,#editor{display:none!important}.wrap{max-width:none;margin:0;padding:0}.panel,.card{box-shadow:none;border:1px solid #ddd;background:white;color:#17233a}.card b,h1,h3{color:#17233a}th{background:#eee;color:#17233a}td{color:#17233a}}
</style></head><body><header><div><h2>🛠 TI Desk <small>4.0</small></h2><small>Central de serviços, ativos e relatórios</small></div><small>☁️ Dados sincronizados · Acesso protegido</small></header><div class="wrap"><nav id="nav"></nav><main id="app"></main></div><div class="foot">TI Desk 4.0 · Faça backups regularmente. Não armazene senhas ou informações sensíveis.</div><script>
'use strict';
const KEY='tidesk-v2',OLD='tidesk-v1';const defaults={clients:[],assets:[],tickets:[],services:[{id:1,name:'Visita técnica',price:90},{id:2,name:'Formatação',price:150},{id:3,name:'Manutenção técnica',price:150},{id:4,name:'Troca de fonte ATX',price:130},{id:5,name:'Reinstalação de sistema operacional',price:100}],settings:{technician:'',company:'Minha assistência técnica'}};
const clone=x=>JSON.parse(JSON.stringify(x));let db;try{db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'null')||clone(defaults)}catch{db=clone(defaults)}for(const k of ['clients','assets','tickets','services'])if(!Array.isArray(db[k]))db[k]=clone(defaults[k]);db.settings={...defaults.settings,...(db.settings||{})};let tab='dashboard',search='',statusFilter='Todos';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=v=>v?new Date(v).toLocaleString('pt-BR'):'—';const uid=()=>Date.now()+Math.floor(Math.random()*100000);const nameOf=(arr,id)=>arr.find(x=>String(x.id)===String(id))?.name||'—';const clientName=id=>nameOf(db.clients,id);const assetName=id=>nameOf(db.assets,id);const save=()=>cloudSave();const opt=(arr,selected)=>arr.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(selected)?'selected':''}>${esc(x.name)}</option>`).join('');const sel=(values,selected)=>values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('');const field=(label,key,value='',type='text',required=false)=>`<div><label>${label}</label><input name="${key}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`;const area=(label,key,value='')=>`<div class="wide"><label>${label}</label><textarea name="${key}">${esc(value)}</textarea></div>`;const formData=f=>Object.fromEntries(new FormData(f).entries());const done=t=>t.status==='Concluído'||t.status==='Cancelado';const due=t=>new Date(t.created).getTime()+Number(t.sla||24)*3600000;const late=t=>!done(t)&&Date.now()>due(t);const hours=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/360000)/10);const total=t=>Number(t.price||0);const filterText=(arr,term,fn)=>arr.filter(x=>fn(x).toLowerCase().includes(term.toLowerCase()));
function go(t){tab=t;search='';statusFilter='Todos';render()}function render(){if(!cloudReady)return;const tabs=[['dashboard','📊 Painel'],['tickets','🎫 Chamados'],['clients','👥 Clientes'],['assets','💻 Inventário'],['services','💰 Serviços'],['reports','📈 Relatórios'],['backup','⚙️ Configurações']];$('#nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('#app').innerHTML=({dashboard,tickets,clients,assets,services,reports,backup})[tab]();}
function dashboard(){const open=db.tickets.filter(t=>!done(t)),completed=db.tickets.filter(t=>t.status==='Concluído');return `<h1>Visão geral</h1><div class="cards">${[['Chamados abertos',open.length],['SLA vencido',open.filter(late).length],['Concluídos',completed.length],['Clientes',db.clients.length],['Ativos cadastrados',db.assets.length],['Serviços concluídos',money(completed.reduce((s,t)=>s+total(t),0))]].map(([a,b])=>`<div class="card"><span class="muted">${a}</span><b>${b}</b></div>`).join('')}</div><div class="panel"><h3>Chamados recentes</h3>${ticketTable(db.tickets.slice().reverse().slice(0,10))}</div><div class="panel"><h3>Acesso rápido</h3><div class="actions"><button onclick="go('tickets');showTicketForm()">+ Abrir chamado</button><button onclick="go('assets');showAssetForm()">+ Cadastrar equipamento</button><button class="secondary" onclick="go('reports')">Ver relatórios</button></div></div>`}
function ticketTable(rows){return `<div class="scroll"><table><thead><tr><th>#</th><th>Cliente</th><th>Assunto</th><th>Equipamento</th><th>Prioridade</th><th>Status</th><th>SLA</th><th>Valor</th><th>Ação</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(clientName(t.client))}</td><td>${esc(t.subject)}</td><td>${esc(assetName(t.asset))}</td><td>${esc(t.priority)}</td><td><span class="tag">${esc(t.status)}</span></td><td><span class="tag ${late(t)?'late':done(t)?'good':''}">${late(t)?'Atrasado':done(t)?'Finalizado':'No prazo'}</span></td><td>${money(t.price)}</td><td><button onclick="showTicketForm(${Number(t.id)})">Abrir</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Nenhum chamado encontrado.</td></tr>'}</tbody></table></div>`}
function tickets(){let arr=db.tickets.slice().reverse().filter(t=>(statusFilter==='Todos'||t.status===statusFilter)&&`${t.subject} ${t.id} ${clientName(t.client)} ${t.technician||''}`.toLowerCase().includes(search.toLowerCase()));return `<h1>Chamados técnicos</h1><div class="actions"><button onclick="showTicketForm()">+ Novo chamado</button><input style="max-width:320px" placeholder="Buscar chamado ou cliente" value="${esc(search)}" oninput="search=this.value;refreshList('tickets')"><select style="max-width:230px" onchange="statusFilter=this.value;refreshList('tickets')"><option>Todos</option>${sel(['Aberto','Em atendimento','Aguardando cliente','Concluído','Cancelado'],statusFilter)}</select></div><div id="editor"></div><div class="panel" id="listing">${ticketTable(arr)}</div>`}
function refreshList(t){if(t==='tickets'){$('#listing').innerHTML=ticketTable(db.tickets.slice().reverse().filter(x=>(statusFilter==='Todos'||x.status===statusFilter)&&`${x.subject} ${x.id} ${clientName(x.client)} ${x.technician||''}`.toLowerCase().includes(search.toLowerCase())))}else if(t==='assets'){$('#listing').innerHTML=assetTable(db.assets.filter(x=>`${x.name} ${x.serial||''} ${x.ip||''} ${clientName(x.client)}`.toLowerCase().includes(search.toLowerCase())))}else if(t==='clients'){$('#listing').innerHTML=clientTable(db.clients.filter(x=>`${x.name} ${x.phone||''} ${x.email||''}`.toLowerCase().includes(search.toLowerCase())))}}
function showTicketForm(id){const t=db.tickets.find(x=>x.id===id)||{id:0,client:'',asset:'',subject:'',description:'',priority:'Média',status:'Aberto',sla:24,price:0,service:'',technician:db.settings.technician,created:new Date().toISOString(),history:[]};$('#editor').innerHTML=`<div class="panel"><h3>${id?'Chamado #'+id:'Novo chamado'}</h3><form id="ticketform" onsubmit="submitTicket(event,${Number(id||0)})"><div class="formgrid"><div><label>Cliente *</label><select name="client" required><option value="">Selecione</option>${opt(db.clients,t.client)}</select></div>${field('Assunto *','subject',t.subject,'text',true)}<div><label>Equipamento vinculado</label><select name="asset"><option value="">Nenhum</option>${opt(db.assets,t.asset)}</select></div><div><label>Prioridade</label><select name="priority">${sel(['Baixa','Média','Alta','Crítica'],t.priority)}</select></div><div><label>Status</label><select name="status">${sel(['Aberto','Em atendimento','Aguardando cliente','Concluído','Cancelado'],t.status)}</select></div>${field('Técnico responsável','technician',t.technician||'')}${field('SLA (horas corridas)','sla',t.sla,'number',true)}<div><label>Serviço</label><select name="service" onchange="let s=db.services.find(x=>String(x.id)===this.value);if(s)this.form.elements.price.value=s.price"><option value="">Avulso</option>${opt(db.services,t.service)}</select></div>${field('Valor cobrado (R$)','price',t.price,'number')}${area('Descrição do problema','description',t.description)}${id?area('Adicionar anotação ao histórico','note',''):''}</div><div class="actions"><button type="submit">Salvar chamado</button><button type="button" class="secondary" onclick="document.querySelector('#editor').innerHTML=''">Fechar</button>${id?`<button type="button" class="secondary" onclick="printTicket(${id})">Imprimir OS</button><button type="button" class="danger" onclick="removeRecord('tickets',${id})">Excluir</button>`:''}</div></form>${id?`<h3>Histórico de movimentações</h3><div class="help">Aberto em ${date(t.created)} · ${t.closed?'Encerrado em '+date(t.closed):'Ainda não encerrado'} · Tempo decorrido: ${hours(t.created,t.closed||new Date().toISOString())} h</div><div class="scroll"><table><tr><th>Data</th><th>Ocorrência</th></tr>${(t.history||[]).slice().reverse().map(h=>`<tr><td>${date(h.at)}</td><td>${esc(h.text)}</td></tr>`).join('')}</table></div>`:''}</div>`;$('#editor').scrollIntoView({behavior:'smooth',block:'start'})}
function submitTicket(e,id){e.preventDefault();const d=formData(e.target),now=new Date().toISOString();let t=db.tickets.find(x=>x.id===id),old=t?.status;if(!t){t={id:uid(),created:now,history:[]};db.tickets.push(t)}Object.assign(t,{client:d.client,asset:d.asset,subject:d.subject,description:d.description,priority:d.priority,status:d.status,technician:d.technician,sla:Math.max(1,Number(d.sla)||24),service:d.service,price:Math.max(0,Number(d.price)||0)});if(t.status==='Concluído'&&!t.closed)t.closed=now;if(t.status!=='Concluído')t.closed=null;t.history=t.history||[];t.history.push({at:now,text:(old&&old!==t.status?`Status alterado de ${old} para ${t.status}. `:'')+(d.note?.trim()||(!id?'Chamado criado.':'Dados atualizados.'))});save();render();showTicketForm(t.id)}
function clients(){return `<h1>Clientes</h1><div class="actions"><button onclick="showClientForm()">+ Novo cliente</button><input style="max-width:320px" placeholder="Buscar cliente" oninput="search=this.value;refreshList('clients')"></div><div id="editor"></div><div class="panel" id="listing">${clientTable(db.clients)}</div>`}
function clientTable(rows){return `<div class="scroll"><table><tr><th>Nome / Empresa</th><th>Contato</th><th>Telefone</th><th>E-mail</th><th>Cidade</th><th>Chamados</th><th>Ação</th></tr>${rows.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.contact)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.city)}</td><td>${db.tickets.filter(t=>String(t.client)===String(c.id)).length}</td><td><button onclick="showClientForm(${c.id})">Editar</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum cliente cadastrado.</td></tr>'}</table></div>`}
function showClientForm(id){let c=db.clients.find(x=>x.id===id)||{};$('#editor').innerHTML=`<div class="panel"><h3>${id?'Editar cliente':'Novo cliente'}</h3><form onsubmit="submitClient(event,${Number(id||0)})"><div class="formgrid">${field('Nome / Razão social *','name',c.name,'text',true)}${field('Responsável','contact',c.contact)}${field('Telefone / WhatsApp','phone',c.phone)}${field('E-mail','email',c.email,'email')}${field('CPF / CNPJ (opcional)','document',c.document)}${field('Cidade / UF','city',c.city)}${field('Endereço','address',c.address)}${area('Observações','notes',c.notes)}</div><div class="actions"><button>Salvar cliente</button>${id?`<button type="button" class="danger" onclick="removeRecord('clients',${id})">Excluir</button>`:''}</div></form></div>`}
function submitClient(e,id){e.preventDefault();let c=db.clients.find(x=>x.id===id);if(!c){c={id:uid()};db.clients.push(c)}Object.assign(c,formData(e.target));save();render()}
const types=['Desktop','Notebook','Servidor','Impressora','Switch','Roteador','Firewall','Access Point','Nobreak','Monitor','Câmera / DVR','Telefone / VoIP','Outro'];
function assets(){return `<h1>Inventário de TI</h1><div class="actions"><button onclick="showAssetForm()">+ Novo equipamento</button><input style="max-width:340px" placeholder="Buscar patrimônio, série, IP ou cliente" oninput="search=this.value;refreshList('assets')"><button class="secondary" onclick="exportCSV('assets')">Exportar CSV</button></div><div id="editor"></div><div class="panel" id="listing">${assetTable(db.assets)}</div>`}
function assetTable(rows){return `<div class="scroll"><table><tr><th>Patrimônio</th><th>Equipamento</th><th>Tipo</th><th>Cliente</th><th>IP</th><th>Série</th><th>Situação</th><th>Garantia</th><th>Ação</th></tr>${rows.map(a=>`<tr><td>${esc(a.tag)}</td><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${esc(clientName(a.client))}</td><td>${esc(a.ip)}</td><td>${esc(a.serial)}</td><td><span class="tag">${esc(a.status)}</span></td><td>${esc(a.warranty||'—')}</td><td><button onclick="showAssetForm(${a.id})">Abrir</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Nenhum equipamento cadastrado.</td></tr>'}</table></div>`}
function showAssetForm(id){let a=db.assets.find(x=>x.id===id)||{type:'Desktop',status:'Em uso'};let related=db.tickets.filter(t=>String(t.asset)===String(id));$('#editor').innerHTML=`<div class="panel"><h3>${id?'Equipamento: '+esc(a.name):'Novo equipamento'}</h3><form onsubmit="submitAsset(event,${Number(id||0)})"><div class="formgrid">${field('Nome / Identificação *','name',a.name,'text',true)}<div><label>Categoria</label><select name="type">${sel(types,a.type)}</select></div><div><label>Cliente / Empresa</label><select name="client"><option value="">Próprio</option>${opt(db.clients,a.client)}</select></div>${field('Patrimônio','tag',a.tag)}${field('Fabricante','brand',a.brand)}${field('Modelo','model',a.model)}${field('Número de série','serial',a.serial)}${field('Hostname','hostname',a.hostname)}${field('Endereço IP','ip',a.ip)}${field('MAC Address','mac',a.mac)}${field('Sistema operacional / Firmware','os',a.os)}${field('Processador','cpu',a.cpu)}${field('Memória RAM','ram',a.ram)}${field('Disco / Armazenamento','disk',a.disk)}${field('Localização / Setor','location',a.location)}${field('Usuário responsável','owner',a.owner)}${field('Data da compra','purchase',a.purchase,'date')}${field('Fim da garantia','warranty',a.warranty,'date')}<div><label>Situação</label><select name="status">${sel(['Em uso','Estoque','Manutenção','Emprestado','Baixado'],a.status)}</select></div>${area('Observações / Histórico técnico','notes',a.notes)}</div><div class="actions"><button>Salvar equipamento</button>${id?`<button type="button" class="danger" onclick="removeRecord('assets',${id})">Excluir</button>`:''}</div></form>${id?`<h3>Chamados vinculados (${related.length})</h3>${ticketTable(related)}`:''}</div>`}
function submitAsset(e,id){e.preventDefault();let a=db.assets.find(x=>x.id===id);if(!a){a={id:uid()};db.assets.push(a)}Object.assign(a,formData(e.target));save();render();showAssetForm(a.id)}
function services(){return `<h1>Catálogo de serviços</h1><div class="panel"><h3>Novo serviço</h3><form class="formgrid" onsubmit="submitService(event)">${field('Descrição *','name','','text',true)}${field('Valor padrão (R$)','price',0,'number',true)}<div style="align-self:end"><button>Adicionar serviço</button></div></form></div><div class="panel"><div class="scroll"><table><tr><th>Serviço</th><th>Preço</th><th>Ações</th></tr>${db.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${money(s.price)}</td><td><button onclick="editService(${s.id})">Editar</button> <button class="danger" onclick="removeRecord('services',${s.id})">Excluir</button></td></tr>`).join('')}</table></div></div>`}
function submitService(e){e.preventDefault();let d=formData(e.target);db.services.push({id:uid(),name:d.name,price:Math.max(0,Number(d.price)||0)});save();render()}function editService(id){let s=db.services.find(x=>x.id===id);let n=prompt('Nome do serviço:',s.name);if(n===null)return;let p=prompt('Valor (R$):',s.price);if(p===null)return;if(!n.trim()||!Number.isFinite(Number(p))||Number(p)<0)return alert('Dados inválidos.');s.name=n.trim();s.price=Number(p);save();render()}
function removeRecord(type,id){if(type==='clients'&&(db.tickets.some(t=>String(t.client)===String(id))||db.assets.some(a=>String(a.client)===String(id))))return alert('Cliente vinculado a chamados ou equipamentos. Remova os vínculos antes.');if(type==='assets'&&db.tickets.some(t=>String(t.asset)===String(id)))return alert('Equipamento vinculado a chamados. Remova os vínculos antes.');if(!confirm('Excluir permanentemente este registro?'))return;db[type]=db[type].filter(x=>x.id!==id);save();render()}
function reports(){const completed=db.tickets.filter(t=>t.status==='Concluído'),revenue=completed.reduce((a,t)=>a+total(t),0),avg=completed.length?completed.reduce((a,t)=>a+hours(t.created,t.closed||new Date()),0)/completed.length:0;let byStatus=['Aberto','Em atendimento','Aguardando cliente','Concluído','Cancelado'].map(k=>[k,db.tickets.filter(t=>t.status===k).length]),byType=types.map(k=>[k,db.assets.filter(a=>a.type===k).length]).filter(x=>x[1]),byClient=db.clients.map(c=>[c.name,db.tickets.filter(t=>String(t.client)===String(c.id)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);return `<h1>Relatórios e indicadores</h1><div class="actions"><button onclick="window.print()">🖨 Imprimir / PDF</button><button class="secondary" onclick="exportCSV('tickets')">CSV de chamados</button><button class="secondary" onclick="exportCSV('assets')">CSV de inventário</button><button class="secondary" onclick="exportCSV('clients')">CSV de clientes</button></div><div class="cards">${[['Total de chamados',db.tickets.length],['Concluídos',completed.length],['Em atraso',db.tickets.filter(late).length],['Tempo médio de resolução',avg.toFixed(1)+' h'],['Valor concluído',money(revenue)],['Ativos',db.assets.length]].map(([k,v])=>`<div class="card"><span class="muted">${k}</span><b>${v}</b></div>`).join('')}</div><div class="panel"><h3>Chamados por status</h3>${bars(byStatus)}</div><div class="panel"><h3>Equipamentos por categoria</h3>${bars(byType)}</div><div class="panel"><h3>Clientes com mais chamados</h3>${bars(byClient.slice(0,10))}</div><div class="panel"><h3>Chamados concluídos e valores</h3>${ticketTable(completed.slice().reverse())}</div><p class="help">SLA calculado em horas corridas desde a abertura; o tempo médio é medido entre abertura e conclusão. Valores representam serviços concluídos, não pagamentos confirmados.</p>`}
function bars(rows){let max=Math.max(1,...rows.map(x=>x[1]));return rows.length?rows.map(([k,v])=>`<div style="display:grid;grid-template-columns:minmax(130px,1fr) 3fr 45px;gap:12px;align-items:center;margin:10px 0"><span>${esc(k)}</span><div class="bar"><i style="width:${100*v/max}%"></i></div><b>${v}</b></div>`).join(''):'<div class="empty">Sem dados para exibir.</div>'}
function exportCSV(type){let rows=db[type],keys=type==='tickets'?['id','created','closed','client','asset','subject','description','priority','status','technician','sla','service','price']:type==='assets'?['id','name','type','client','tag','brand','model','serial','hostname','ip','mac','os','cpu','ram','disk','location','owner','purchase','warranty','status','notes']:['id','name','contact','phone','email','document','city','address','notes'];let cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let csv='\ufeff'+keys.map(cell).join(';')+'\r\n'+rows.map(x=>keys.map(k=>cell(k==='client'?clientName(x[k]):k==='asset'?assetName(x[k]):x[k])).join(';')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`ti-desk-${type}-${new Date().toISOString().slice(0,10)}.csv`)}
function download(blob,filename){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){download(new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),`ti-desk-backup-${new Date().toISOString().slice(0,10)}.json`)}async function importJSON(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text()),d=obj.data||obj;if(!['clients','assets','tickets','services'].every(k=>Array.isArray(d[k])))throw Error('Estrutura inválida');if(!confirm('Substituir TODOS os dados atuais pelos dados do backup?'))return;db={...clone(defaults),...d,settings:{...defaults.settings,...(d.settings||{})}};save();render();alert('Backup importado com sucesso.')}catch(err){alert('Não foi possível importar: '+err.message)}e.target.value=''}
function backup(){return `<h1>Configurações e segurança</h1><div class="panel"><h3>Preferências</h3><form onsubmit="event.preventDefault();db.settings={...db.settings,...formData(this)};save();alert('Alterações enviadas para sincronização.')"><div class="formgrid">${field('Nome da assistência / empresa','company',db.settings.company)}${field('Técnico padrão','technician',db.settings.technician)}</div><div class="actions"><button>Salvar preferências</button></div></form></div><div class="panel"><h3>Backup completo</h3><p class="help">Baixe periodicamente um JSON de segurança. Restaurar substitui os dados da sua conta após sincronização.</p><div class="actions"><button onclick="exportJSON()">⬇ Baixar backup JSON</button><label style="margin:0">Restaurar backup JSON <input type="file" accept=".json,application/json" onchange="importJSON(event)"></label></div></div><div class="panel"><h3>Conta e nuvem</h3><p id="sync-detail" class="help">Dados vinculados à sua conta no Supabase. Para acessar em outro aparelho, entre com o mesmo e-mail e senha. Atualizações feitas em duas abas simultaneamente podem sobrescrever a versão mais recente.</p><div class="actions"><button class="secondary" onclick="cloudRefresh()">↻ Atualizar da nuvem</button><button class="secondary" onclick="cloudLogout()">Sair da conta</button></div></div>`}
function printTicket(id){let t=db.tickets.find(x=>x.id===id);if(!t)return;let w=window.open('','_blank');if(!w)return alert('Libere pop-ups para imprimir.');let safe=x=>esc(x);w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>OS ${id}</title><style>body{font:15px Arial;margin:35px;color:#17233a}h1{border-bottom:2px solid #173a66;padding-bottom:12px}p{line-height:1.7}.line{border-bottom:1px solid #aaa;margin-top:65px;width:45%;display:inline-block;text-align:center;margin-right:5%}</style></head><body><h1>${safe(db.settings.company)} · Ordem de Serviço #${id}</h1><p><b>Cliente:</b> ${safe(clientName(t.client))}<br><b>Equipamento:</b> ${safe(assetName(t.asset))}<br><b>Assunto:</b> ${safe(t.subject)}<br><b>Descrição:</b> ${safe(t.description)}<br><b>Prioridade:</b> ${safe(t.priority)}<br><b>Status:</b> ${safe(t.status)}<br><b>Técnico:</b> ${safe(t.technician)}<br><b>Abertura:</b> ${date(t.created)}<br><b>Conclusão:</b> ${date(t.closed)}<br><b>Valor:</b> ${money(t.price)}</p><div class="line">Assinatura do técnico</div><div class="line">Assinatura do cliente</div></body></html>`);w.document.close();w.focus();w.print()}

</script><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="cloud.js"></script></body></html>
